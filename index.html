<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maricota Store – Gerador de Conteúdo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #fff5f7; color: #3d1c1c; min-height: 100vh; }
  header { background: #b5451b; color: white; padding: 20px; text-align: center; }
  header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; }
  header p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
  .container { max-width: 600px; margin: 0 auto; padding: 20px; }
  .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #b5451b; display: block; margin-bottom: 8px; }
  input, textarea { width: 100%; padding: 12px; border: 1.5px solid #f0d0c8; border-radius: 10px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
  input:focus, textarea:focus { border-color: #b5451b; }
  textarea { resize: vertical; min-height: 80px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 16px; border-radius: 20px; border: 1.5px solid #f0d0c8; background: white; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
  .chip.active { background: #b5451b; color: white; border-color: #b5451b; }
  .formatos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .formato { padding: 14px; border-radius: 12px; border: 1.5px solid #f0d0c8; background: white; cursor: pointer; transition: all 0.2s; }
  .formato.active { background: #fff0ec; border-color: #b5451b; }
  .formato strong { display: block; font-size: 0.9rem; color: #3d1c1c; }
  .formato span { font-size: 0.75rem; color: #999; }
  .btn { width: 100%; padding: 16px; background: #b5451b; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: #8f3515; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .resultado { display: none; }
  .output-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
  .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .output-type { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #b5451b; }
  .copy-btn { padding: 6px 14px; background: #fff0ec; border: 1px solid #b5451b; color: #b5451b; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
  .output-text { font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; color: #3d1c1c; }
  .loading { text-align: center; padding: 30px; display: none; }
  .spinner { width: 36px; height: 36px; border: 3px solid #f0d0c8; border-top-color: #b5451b; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>✨ Maricota Store</h1>
  <p>Gerador de Conteúdo</p>
</header>
<div class="container">
  <div class="card">
    <label>Nome da Peça</label>
    <input type="text" id="nome" placeholder="Ex: Vestido Jardim Encantado">
  </div>
  <div class="card">
    <label>Preço</label>
    <input type="text" id="preco" placeholder="Ex: R$ 89,90">
  </div>
  <div class="card">
    <label>Tamanhos Disponíveis</label>
    <input type="text" id="tamanhos" placeholder="Ex: 1, 2, 3, 4, 6, 8">
  </div>
  <div class="card">
    <label>Descrição da Peça (opcional)</label>
    <textarea id="descricao" placeholder="Ex: Vestido floral com babado, tecido leve, perfeito para o verão..."></textarea>
  </div>
  <div class="card">
    <label>Tom do Conteúdo</label>
    <div class="chips">
      <div class="chip active" onclick="toggleChip(this,'tom')">Alegre e afetivo</div>
      <div class="chip" onclick="toggleChip(this,'tom')">Divertido</div>
      <div class="chip" onclick="toggleChip(this,'tom')">Elegante</div>
      <div class="chip" onclick="toggleChip(this,'tom')">Fofo</div>
    </div>
  </div>
  <div class="card">
    <label>Formatos para Gerar</label>
    <div class="formatos">
      <div class="formato active" onclick="toggleFormato(this)">
        <strong>Post feed</strong><span>Legenda + CTA</span>
      </div>
      <div class="formato" onclick="toggleFormato(this)">
        <strong>Carrossel</strong><span>6 slides prontos</span>
      </div>
      <div class="formato" onclick="toggleFormato(this)">
        <strong>Reels / TikTok</strong><span>Roteiro completo</span>
      </div>
      <div class="formato" onclick="toggleFormato(this)">
        <strong>Stories</strong><span>Sequência de 5</span>
      </div>
      <div class="formato" onclick="toggleFormato(this)">
        <strong>WhatsApp</strong><span>Lista de transmissão</span>
      </div>
    </div>
  </div>
  <button class="btn" onclick="gerar()">✦ Gerar conteúdo</button>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Gerando conteúdo com IA...</p>
  </div>
  <div class="resultado" id="resultado"></div>
</div>
<script>
function toggleChip(el, grupo) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}
function toggleFormato(el) {
  el.classList.toggle('active');
}
async function gerar() {
  const nome = document.getElementById('nome').value.trim();
  const preco = document.getElementById('preco').value.trim();
  const tamanhos = document.getElementById('tamanhos').value.trim();
  const descricao = document.getElementById('descricao').value.trim();
  const tom = document.querySelector('.chip.active')?.textContent || 'Alegre e afetivo';
  const formatos = [...document.querySelectorAll('.formato.active')].map(f => f.querySelector('strong').textContent);

  if (!nome || !preco) { alert('Preencha pelo menos o nome e o preço da peça!'); return; }
  if (formatos.length === 0) { alert('Selecione pelo menos um formato!'); return; }

  document.getElementById('loading').style.display = 'block';
  document.getElementById('resultado').style.display = 'none';
  document.querySelector('.btn').disabled = true;

  const prompt = `Você é especialista em marketing para lojas de roupas infantis. 
Crie conteúdo para a Maricota Store com estas informações:
- Peça: ${nome}
- Preço: ${preco}
- Tamanhos: ${tamanhos || 'não informado'}
- Descrição: ${descricao || 'não informada'}
- Tom: ${tom}
- Slogan da marca: "Para voar com estilo desde cedo"

Gere os seguintes formatos, separando cada um com === NOME_DO_FORMATO ===:
${formatos.map(f => `=== ${f.toUpperCase()} ===`).join('\n')}

Para cada formato, crie conteúdo completo, pronto para usar, com emojis e linguagem para mães e pais brasileiros.`;

  try {
    const response = await fetch('/api/gerar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Erro desconhecido');
    mostrarResultado(data.content, formatos);
  } catch (err) {
    alert('Erro ao gerar conteúdo. Tente novamente.');
    console.error(err);
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.querySelector('.btn').disabled = false;
  }
}

function mostrarResultado(texto, formatos) {
  const section = document.getElementById('resultado');
  section.innerHTML = '';
  section.style.display = 'block';
  const partes = texto.split(/===\s*([^=]+?)\s*===/g).filter(s => s.trim());
  for (let i = 0; i < partes.length - 1; i += 2) {
    const titulo = partes[i].trim();
    const conteudo = partes[i+1] ? partes[i+1].trim() : '';
    if (!conteudo) continue;
    const card = document.createElement('div');
    card.className = 'output-card';
    card.innerHTML = `
      <div class="output-header">
        <span class="output-type">${titulo}</span>
        <button class="copy-btn" onclick="copiar(this, \`${conteudo.replace(/`/g,'\\`')}\`)">Copiar</button>
      </div>
      <div class="output-text">${conteudo}</div>`;
    section.appendChild(card);
  }
  if (!section.children.length) {
    section.innerHTML = `<div class="output-card"><div class="output-text">${texto}</div></div>`;
  }
}

function copiar(btn, texto) {
  navigator.clipboard.writeText(texto).then(() => {
    btn.textContent = 'Copiado!';
    setTimeout(() => btn.textContent = 'Copiar', 2000);
  });
}
</script>
</body>
</html>
